name: daily-rank-check

on:
  # 毎日の自動実行（2026-11-05 有効化: DataForSEO・Apify の試運転が済んだため）
  schedule:
    # 2026-11-07: GitHub の定時実行は 11/6・11/7 とも起動しなかった。毎朝の起動は Apps Script（apps-script/Trigger.gs、7 時台 VN）に移し、
    # これは予備（その日の計測が済んでいれば run.py --skip-if-done で何もしない）
    - cron: "47 2 * * *"   # 02:47 UTC = ベトナム時間 9:47
  workflow_dispatch:        # 手動実行（GitHub の Actions 画面の「Run workflow」）
    inputs:
      mode:
        description: "実行の種類"
        type: choice
        options:
          - sheet-test      # API を呼ばず、見本の行をスプレッドシートの ranks_test シートに書く
          - production      # 本番（DataForSEO・Apify を呼ぶ）
          - bing-diagnose   # Bing の結果なし（40102）の切り分け（16 タスク・数セント、記録はしない）
          - yahoo-test      # Yahoo! JAPAN（Apify）だけを測る（DataForSEO は使わない）。limit 空欄で 2 語、17 で全語
          - recover         # 登録済み（課金済み）で未回収の今日の Google・Bing の結果を回収して記録（新たな課金なし）
        default: sheet-test
      limit:
        description: "キーワードを各言語この数に絞る（空欄なら全部。sheet-test では無視）"
        required: false
        default: ""

permissions:
  contents: write           # data/ranks.csv をリポジトリに保存するため

concurrency:
  group: daily-rank-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: 計測
        env:
          DFS_LOGIN: ${{ secrets.DFS_LOGIN }}
          DFS_PASSWORD: ${{ secrets.DFS_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          PYTHONUNBUFFERED: "1"     # ログを途中経過から表示する
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python run.py --skip-if-done 100   # 予備: Apps Script からの朝の実行で済んでいれば何もしない
          elif [ "${{ github.event.inputs.mode }}" = "sheet-test" ]; then
            python run.py --sheet-test
          elif [ "${{ github.event.inputs.mode }}" = "bing-diagnose" ]; then
            python run.py --diagnose-bing
          elif [ "${{ github.event.inputs.mode }}" = "recover" ]; then
            python run.py --recover
          elif [ "${{ github.event.inputs.mode }}" = "yahoo-test" ]; then
            python run.py --only-yahoo --limit "${{ github.event.inputs.limit || '2' }}"   # limit に 17 で全語
          elif [ -n "${{ github.event.inputs.limit }}" ]; then
            python run.py --limit "${{ github.event.inputs.limit }}"
          else
            python run.py
          fi
      - name: CSV を保存
        if: always()
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add data/ranks.csv || true
          git diff --cached --quiet || git commit -m "ranks $(date -u +%F)"
          git push || true
